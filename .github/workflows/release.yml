name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: |
          for rid in linux-x64 win-x64; do
            dotnet publish src/MMAway -c Release -r $rid --self-contained -p:PublishSingleFile=true -o publish/$rid
            (cd publish/$rid && zip -r ../../MMAway-$rid.zip .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MMAway
          path: MMAway-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MMAway-*.zip
